<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="GeekLab极客工坊 - 嵌入式开发技术博客，分享开发经验与工具使用技巧">
    <meta name="keywords" content="嵌入式,开发工具,技术博客,AI编程,树莓派,单片机">
    <meta name="author" content="GeekLab">
    <title>GeekLab极客工坊 | 技术博客</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .blog-container { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        .blog-list-page { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 1rem; overflow: hidden; }
        .blog-item { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; border-bottom: 1px solid var(--border-color); text-decoration: none; color: var(--text-primary); transition: background 0.2s; }
        .blog-item:last-child { border-bottom: none; }
        .blog-item:hover { background: var(--tool-bg); }
        .blog-title { font-weight: 500; }
        .blog-date { color: var(--text-secondary); font-size: 0.8rem; }
        .pagination { display: flex; justify-content: center; gap: 0.5rem; margin-top: 2rem; }
        .page-btn { padding: 0.5rem 1rem; background: var(--tool-bg); border: 1px solid var(--border-color); border-radius: 0.5rem; text-decoration: none; color: var(--text-primary); }
        .page-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="container nav-content">
            <div class="logo">⚡ GeekLab</div>
            <div class="nav-links">
                <a href="index.html" class="active">首页</a>
                <a href="tools/hex-converter.html">工具集</a>
                <a href="tools.html">工具箱</a>
                <button class="theme-toggle" id="themeToggle" aria-label="切换主题">🌙</button>
            </div>
            <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="菜单">☰</button>
        </div>
    </div>

    <div class="blog-container">
        <h1>📝 技术博客</h1>
        <p style="color:var(--text-secondary); margin-bottom:2rem;">分享嵌入式开发经验、工具使用技巧</p>

        <div class="blog-list-page" id="blogList"></div>

        <div class="pagination" id="pagination"></div>
    </div>

    <footer>
        <div class="container footer-content">
            <div class="footer-section">
                <h4>GeekLab</h4>
                <p>专注嵌入式开发工具与模块</p>
            </div>
            <div class="footer-section">
                <h4>快速链接</h4>
                <a href="tools/hex-converter.html">在线工具</a>
                <a href="index.html">技术博客</a>
                <a href="tools.html">工具箱</a>
            </div>
            <div class="footer-section">
                <h4>联系方式</h4>
                <a href="mailto:geeklab@example.com">geeklab@example.com</a>
            </div>
        </div>
        <div class="footer-bottom">
            <div class="container">
                © 2026 GeekLab 极客工坊 · 保留所有权利
            </div>
        </div>
    </footer>

    <script src="assets/js/main.js"></script>
    <script>
        const blogPosts = [
            { title: "常用 AI 工具比较分析", date: "2026-06-21", url: "blog/posts/ai-debug-tools.html", category: "工具教程" },
            { title: "树莓派学习笔记：安装 VSCode 编译程序", date: "2026-06-21", url: "blog/posts/raspberry-pi-notes.html", category: "硬件开发" },
            { title: "单片机网络不常见问题分析", date: "2026-06-21", url: "blog/posts/mcu-network-issues.html", category: "编程技术" }
        ];

        const postsPerPage = 5;
        let currentPage = 1;

        function renderBlogList() {
            const start = (currentPage - 1) * postsPerPage;
            const end = start + postsPerPage;
            const pagePosts = blogPosts.slice(start, end);

            const container = document.getElementById('blogList');
            container.innerHTML = pagePosts.map(post => `
                <a href="${post.url}" class="blog-item">
                    <span class="blog-title">${post.title}</span>
                    <span class="blog-date">${post.date}</span>
                </a>
            `).join('');

            renderPagination();
        }

        function renderPagination() {
            const totalPages = Math.ceil(blogPosts.length / postsPerPage);
            const container = document.getElementById('pagination');
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }

            let html = '';
            for (let i = 1; i <= totalPages; i++) {
                html += `<a href="#" class="page-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</a>`;
            }
            container.innerHTML = html;

            document.querySelectorAll('.page-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    currentPage = parseInt(btn.getAttribute('data-page'));
                    renderBlogList();
                    window.scrollTo(0, 0);
                });
            });
        }

        renderBlogList();
    </script>
</body>
</html>
